[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = tests.py test_*.py *_tests.py
testpaths = tests
addopts =
    -ra
    --strict-markers
    --cov=apps
    --cov=config
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
markers =
    slow: sekin ishlaydigan testlar
